info:
  name: Update Message
  type: http
  seq: 6
  tags:
    - messages
    - crud

http:
  method: PUT
  url: http://localhost:9090/messages/:id
  params:
    - name: id
      value: "{{messageId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "text": "Отредактированное сообщение"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("статус 200 OK", function() {
          expect(res.status).to.equal(200);
        });

        test("текст обновлён", function() {
          expect(res.body.text).to.equal("Отредактированное сообщение");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Update Message

  Обновляет сообщение по `:id` ({{messageId}}). Здесь использован метод PUT
  (полная замена). Для частичного обновления поменяйте метод на PATCH.
