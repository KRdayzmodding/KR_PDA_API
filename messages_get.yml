info:
  name: Get Message
  type: http
  seq: 5
  tags:
    - messages
    - crud

http:
  method: GET
  url: http://localhost:9090/messages/:id
  params:
    - name: id
      value: "{{messageId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("статус 200 OK", function() {
          expect(res.status).to.equal(200);
        });

        test("id совпадает с запрошенным", function() {
          expect(String(res.body.id)).to.equal(String(bru.getVar("messageId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Message

  Получает одно сообщение по `:id`. Значение пути берётся из переменной
  `{{messageId}}`, которую устанавливает запрос Create Message.
