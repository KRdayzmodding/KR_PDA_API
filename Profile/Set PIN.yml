info:
  name: Set PIN
  type: http
  seq: 1
  tags:
    - profile

http:
  method: PUT
  url: "{{baseUrl}}/v1/profile/pin"
  body:
    type: json
    data: |-
      {
        "pin": "1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PUT /v1/profile/pin — поставить/сменить PIN (Bearer). Argon2id → accounts.pin_hash.

