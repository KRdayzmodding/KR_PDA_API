info:
  name: List Messages
  type: http
  seq: 3
  tags:
    - messages
    - crud

http:
  method: GET
  url: http://localhost:9090/messages?limit=20&offset=0
  params:
    - name: limit
      value: "20"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("статус 200 OK", function() {
          expect(res.status).to.equal(200);
        });

        test("тело ответа — массив", function() {
          expect(res.body).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List Messages

  Возвращает список сообщений PDA с пагинацией (`limit`, `offset`).

  Замените путь `/messages` и query-параметры на реальные эндпоинты вашего API.
