info:
  name: Login
  type: http
  seq: 2
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "Alice",
        "password": "hunter2pw",
        "device_uid": "{{device_uid}}",
        "server_id": "{{server_id}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 || res.status === 201) {
          if (res.body && res.body.session_token) {
            bru.setEnvVar("token", res.body.session_token);
            bru.setEnvVar("account_id", res.body.account_id);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /v1/auth/login — вход (публичная). Constant-time: неверный пароль и
  несуществующий username → одинаковый 401. 200 → {account_id, session_token}.

